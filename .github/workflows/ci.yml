name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hedgehint
          POSTGRES_PASSWORD: hedgehint
          POSTGRES_DB: hedgehint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Database schema
        env:
          DATABASE_URL: postgres://hedgehint:hedgehint@localhost:5432/hedgehint_test?sslmode=disable
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgres://hedgehint:hedgehint@localhost:5432/hedgehint_test?sslmode=disable
        run: pnpm test

      - name: Run production build
        env:
          DATABASE_URL: postgres://hedgehint:hedgehint@localhost:5432/hedgehint_test?sslmode=disable
        run: pnpm run build
