# Local development database for HedgeHint. Not a production deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hedgehint
      POSTGRES_PASSWORD: hedgehint
      POSTGRES_DB: hedgehint
    ports: ["5433:5432"]
    volumes: ["hedgehint-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedgehint -d hedgehint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hedgehint-pgdata:
